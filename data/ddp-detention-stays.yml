---
# Provenance metadata for DDP Detention Stays dataset (latest release)

source:
  title: "Deportation Data Project — ICE Detention Stays (Latest Release)"
  publisher: "Deportation Data Project"
  principal_investigators:
    - "Graeme Blair, University of California–Los Angeles"
    - "David Hausman, University of California–Berkeley School of Law"
    - "Phil Neff, University of Washington Center for Human Rights"
  url: "https://deportationdata.org/data/processed/ice.html"
  file_url: "https://github.com/deportationdata/ice/raw/refs/heads/main/data/detention-stays-latest.parquet"
  codebook_url: "https://deportationdata.org/docs/ice/codebook.html"
  foia_request: "2026-ICLI-00005"
  notes: >
    A stay-level summary of the ICE detention stints data (see ddp-detention-stints.yml
    for the row-per-stint version). DDP constructs this dataset by grouping stints
    into stays (a single continuous period of ICE detention, possibly spanning
    multiple facilities via transfer) and then reducing each stay to one row. It
    retains details from the first, last, and longest stints, and adds
    detention_facility_codes_all — a semicolon-separated, ordered string of every
    DETLOC code visited during the stay. This is the primary dataset for tracing
    transfer itineraries.
  citation: >
    Blair, Graeme, David Hausman, and Phil Neff. 2025. "Immigration and Customs
    Enforcement Individual-Level Data: An Introduction."
    https://deportationdata.org/docs/ice/ice-data-preprint.pdf
  license: "CC-0 (no rights reserved)"

data:
  filename: "data/ddp/detention-stays-latest_20260514.parquet"
  format: "Parquet"
  rows: 1087417
  columns: 70
  unit_of_observation: >
    One row per detention stay. A stay is a single continuous period of ICE
    detention for one person, which may span multiple facilities via transfer.
    Persons with multiple separate stays (released and re-detained) appear
    once per stay; n_stays records how many total stays that person has.
  temporal_coverage:
    stay_book_in_min: "2004-12-05"
    stay_book_in_max: "2026-03-11"
    stay_book_out_min: "2022-10-01"
    stay_book_out_max: "2026-03-11"
    note: >
      stay_book_out is available from 2022-10-01; stays that began before
      that date are retained only if they were still open or released on/after
      that cutoff.
  distinct_persons: 1014866
  stays_with_multiple_stints: 684787
  distinct_facility_codes: 706

  key_columns:
    stay_ID: "Unique identifier for this detention stay."
    unique_identifier: >
      Anonymized person ID (corresponding to A-number). Links all stays for
      the same individual; also links to the stints dataset.
    n_stints: >
      Number of facility stints comprising this stay. 1 = single facility,
      2+ = at least one transfer.
    n_stays: >
      Total number of separate detention stays on record for this person
      (across all data). Most persons have 1; some have 2–8.
    detention_facility_codes_all: >
      Semicolon-separated, ordered string of every DETLOC facility code
      visited during the stay, from first to last. This is the key column
      for itinerary analysis. Example: "SPMHOLD; KANDIMN; PINEPLA; JENATLA".
      Multiple visits to the same facility within one stay produce duplicate
      entries.
    stay_book_in_date_time: "Start of this detention stay (POSIXct)."
    stay_book_out_date_time: "End of this stay; NA if still detained (POSIXct; ~103k NAs)."
    stay_book_out_date: "Date portion of stay_book_out_date_time."
    stay_release_reason: >
      Reason the stay ended: most common values are Removed, Order of
      recognizance, Bonded Out - IJ, Paroled, Order of supervision.
      ~103k NAs (stays still open or unresolved).

  first_last_longest:
    note: >
      DDP preserves details for three stints within each stay: the first
      (book-in at the start of the stay), the last (book-out from the stay),
      and the longest (the facility where the most time was spent). If a
      stay has only one stint, all three are identical.
    columns:
      - detention_facility_{first/last/longest}: "Facility name"
      - detention_facility_code_{first/last/longest}: "DETLOC code"
      - book_in_date_time_{first/last/longest}: "Stint start (POSIXct)"
      - book_out_date_time_{first/last/longest}: "Stint end (POSIXct)"
      - city_{first/last/longest}: "Facility city (many NAs)"
      - state_{first/last/longest}: "Facility state"
      - county_{first/last/longest}: "Facility county (many NAs)"

  demographic_and_legal_columns:
    note: >
      All person-level fields (demographics, legal status, criminal history,
      bond, removal) are identical to those in the stints dataset. Values
      are taken from the last stint in the stay (per DDP processing), except
      for bond amounts where the lowest initial bond set amount is retained.
      See detention-stints.yml for full column descriptions and NA rates.

  processing_notes:
    - >
      Stays are constructed from stints by grouping on a stay ID. DDP first
      drops duplicate stints (same facility + book-in datetime), then retains
      only the last stint's demographic/legal fields. First and longest stint
      details are joined back separately.
    - >
      detention_facility_codes_all is the only column preserving the full
      transfer chain. It is ordered chronologically and uses semicolons as
      delimiters with a single space after each semicolon ("; ").
    - >
      Persons with multiple stays appear multiple times (once per stay).
      Use unique_identifier to identify repeat detainees. n_stays > 1 means
      the person was released and re-detained at least once.
    - >
      This dataset covers 706 distinct DETLOC codes (same as detention-stints),
      compared to 853 in the older feather-format daily population file.

versions:
  note: >
    DDP overwrites "-latest" files with each release; this project pins local
    copies with the DDP release date as a suffix. Version dates follow DDP's
    GitHub commit history (repo deportationdata/ice), not local download dates.
  releases:
    - version: "20260330"
      label: "March 2026 release (data through 2026-03-11)"
      rows: 1087417
      local_file: "(superseded; not retained separately)"
      notes: "Original 'release' commit version, documented in the first edition of this sidecar."
    - version: "20260514"
      label: "May 14 2026 update — added facility info, removed extraneous columns (current pipeline input)"
      rows: 1087417
      columns: 70
      local_file: "data/ddp/detention-stays-latest_20260514.parquet"
      date_downloaded: "2026-05-24"
      notes: >
        Renamed from detention-stays-latest.parquet. Former pipeline input
        for the stays_file -> stays_raw targets (superseded by the 20260806
        release, wired 2026-10-21). Data covers Oct 2022 – Mar 2026.
    - version: "20260806"
      label: "August 6 2026 release (current pipeline input)"
      rows: 1264756
      columns: 77
      local_file: "data/ddp/detention-stays-latest_20260806.parquet"
      date_downloaded: "2026-10-02"
      changes_from_20260514: >
        +177,339 rows; data extended through August 2026. Schema changes
        parallel the stints 20260806 release: adds 9 derived columns
        (apprehension_final_program_group, age_at_stint/stay_book_in_approximate,
        stay_length_days, final_order_before_book_in,
        stay_release_reason_simple, release_within_60_days,
        release_within_90_days, conviction) and 15 location columns (CBSA
        and federal court district/circuit for each of the first/longest/last
        stint triplets); drops 17 columns (stay_book_out_date, birth_country,
        race, known_terrorist_yes_no, suspected_gang_yes_no, msc_sentence_*,
        msc_charge_date, msc_conviction_date, msc_criminal_charge_status(+_code),
        msc_crime_class, detainee_classification, initial_bond_set_date,
        offense_ina_236c_yes_no, case_ina_236c_yes_no).
      wiring_note: >
        Wired 2026-10-21: stays_file in _targets.R repointed to the _20260806
        file. All columns used by the arrest analyses (unique_identifier,
        stay_book_in_date_time, detention_facility_code_first/_last,
        detention_facility_codes_all, detention_facility_first/_last,
        stay_release_reason, departure_country, citizenship_country) are
        present; duplicate_likely no longer exists in the stays schema but
        was only ever filtered on arrests. The 20260514 release remains on
        disk as a frozen archive; arrest analyses should be re-verified
        (mn-arrests.qmd, nationwide-arrests.qmd, state-arrests.qmd,
        state_arrests_export).

import:
  source_url: "https://github.com/deportationdata/ice/raw/refs/heads/main/data/detention-stays-latest.parquet"
  local_path: "data/ddp/detention-stays-latest_20260514.parquet"
  imported_with: "arrow::read_parquet()"
  pipeline_target: "stays_file -> stays_raw (arrest analyses: mn_arrests_data, nationwide_arrests_report, state_arrests_export)"
  date_downloaded: "2026-05-24"
  related_file: "data/ddp/detention-stints-latest_20260515.parquet"
  note: >
    The companion stints files contain one row per facility stint and support
    more granular itinerary analysis (e.g. time at each facility, exact
    transfer sequences). The stays file is better for person-level analyses
    (release outcomes, demographics, total stay length) and for quickly
    finding stays that include a given facility via
    detention_facility_codes_all.
